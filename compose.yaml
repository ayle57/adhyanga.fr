services:
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adhyanga_dev}
      POSTGRES_USER: ${POSTGRES_USER:-allistair}
      POSTGRES_PASSWORD: Qeroqu-7
    ports:
      - "5432:5432"  # expose le port pour connexion depuis l’hôte
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-adhyanga_dev}", "-U", "${POSTGRES_USER:-allistair}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw

volumes:
  database_data:
